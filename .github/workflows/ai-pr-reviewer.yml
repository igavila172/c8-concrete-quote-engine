name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-auditor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run QA Auditor with Model Cycling
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @google/gemini-cli
          mkdir -p ~/.gemini
          printf '{"%s": "TRUST_FOLDER"}\n' "$GITHUB_WORKSPACE" > ~/.gemini/trustedFolders.json
          python3 .github/scripts/run_gemini_with_fallback.py "Review Pull Request #${{ github.event.pull_request.number }}. Run 'gh pr diff ${{ github.event.pull_request.number }}' and audit the changes against GEMINI.md for BigDecimal financial/yardage accuracy, security, and JUnit 5 test coverage. Post a clear review summary comment using 'gh pr comment ${{ github.event.pull_request.number }} --body "..."'."
