name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-auditor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust workspace for Gemini CLI
        run: |
          mkdir -p ~/.gemini
          printf '{"%s": "TRUST_FOLDER"}\n' "$GITHUB_WORKSPACE" > ~/.gemini/trustedFolders.json
          printf '{"model": {"name": "gemini-3.8-flash-lite"}}\n' > ~/.gemini/settings.json

      - name: Run QA Auditor Agent
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review Pull Request #${{ github.event.pull_request.number }}. Run `gh pr diff ${{ github.event.pull_request.number }}` and audit the changes against GEMINI.md for BigDecimal financial/yardage accuracy, security, and JUnit 5 test coverage. Post a clear review summary comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash-lite
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
