name: Autonomous R&D and Build

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  rd-strategist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run R&D Strategist with Model Cycling
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @google/gemini-cli
          mkdir -p ~/.gemini
          printf '{"%s": "TRUST_FOLDER"}\n' "$GITHUB_WORKSPACE" > ~/.gemini/trustedFolders.json
          python3 .github/scripts/run_gemini_with_fallback.py 'Inspect this C-8 Concrete Quote Engine repository. First run `gh issue list --label ai-build --state open`. If an open issue already exists, stop and do nothing. Otherwise, propose ONE high-impact C-8 concrete contracting feature, pricing edge case, or lead-capture upgrade and create a GitHub Issue using `gh issue create --label ai-build --title "..." --body "..."`.'

  code-builder:
    needs: rd-strategist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Code Builder with Model Cycling
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g @google/gemini-cli
          mkdir -p ~/.gemini
          printf '{"%s": "TRUST_FOLDER"}\n' "$GITHUB_WORKSPACE" > ~/.gemini/trustedFolders.json
          python3 .github/scripts/run_gemini_with_fallback.py 'Check open issues labeled `ai-build` via `gh issue list --label ai-build --state open --json number,title,body`. If none exist, exit cleanly. Otherwise pick the newest issue, create a new git branch (`git checkout -b feat/issue-<number>`), implement the feature following GEMINI.md (BigDecimal money/volume math, JUnit 5 tests), run `./mvnw test` until green, commit and push the branch, and open a Pull Request via `gh pr create --fill` referencing `Closes #<number>`.'
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" != "main" ] && [ -n "$BRANCH" ]; then
            git add -A
            git diff --cached --quiet || git commit -m "feat: implement $BRANCH"
            git push -u origin "$BRANCH"
            ISSUE_NUM=${BRANCH#feat/issue-}
            gh pr list --head "$BRANCH" --json number | grep -q '"number"' || gh pr create --fill --body "Closes #$ISSUE_NUM"
          fi
